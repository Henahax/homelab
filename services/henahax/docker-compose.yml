services:
  henahax-homepage:
    container_name: henahax-homepage
    image: henahax/homepage:latest
    restart: unless-stopped

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      - CACHE_TTL=${CACHE_TTL}
      - VOICE_API_URL=${VOICE_API_URL}

    networks:
      - traefik

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homepage.rule=Host(`henahax.net`) || Host(`www.henahax.net`) || Host(`henahax.de`) || Host(`www.henahax.de`)"
      - "traefik.http.services.homepage.loadbalancer.server.port=4321"

  henahax-voice-server-api:
    container_name: henahax-voice-server-api
    image: henahax/voice-server-api:latest
    restart: unless-stopped

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      - CACHE_TTL=${CACHE_TTL}
      - TEAMSPEAK_BASE_URL=${TEAMSPEAK_BASE_URL}
      - TEAMSPEAK_QUERY_PORT=${TEAMSPEAK_QUERY_PORT}
      - TEAMSPEAK_SERVER_ID=${TEAMSPEAK_SERVER_ID}
      - TEAMSPEAK_API_KEY=${TEAMSPEAK_API_KEY}

    networks:
      - traefik

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.voice.rule=Host(`api.henahax.net`) || Host(`voice-server-api.henahax.net`)"
      - "traefik.http.routers.voice.service=voice"
      - "traefik.http.routers.voice-homepage-api.rule=(Host(`henahax.net`) || Host(`www.henahax.net`)) && PathPrefix(`/api/teamspeak`)"
      - "traefik.http.routers.voice-homepage-api.priority=100"
      - "traefik.http.routers.voice-homepage-api.service=voice"
      - "traefik.http.services.voice.loadbalancer.server.port=3000"

  henahax-gw2-tools:
    container_name: henahax-gw2-tools
    image: henahax/gw2-tools:latest
    restart: unless-stopped

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin

    networks:
      - traefik

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gw2.rule=Host(`gw2.henahax.net`) || Host(`gw2.henahax.de`) || Host(`gw2-tools.henahax.net`) || Host(`gw2-tools.henahax.de`)"
      - "traefik.http.services.gw2.loadbalancer.server.port=3000"

  henahax-treasure-hunt:
    container_name: henahax-treasure-hunt
    image: henahax/treasure-hunt:latest
    restart: unless-stopped

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin

    networks:
      - traefik

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.treasure-hunt.rule=Host(`treasure-hunt.henahax.net`) || Host(`treasure-hunt.henahax.de`) || Host(`treasure.henahax.net`) || Host(`treasure.henahax.de`) || Host(`schnitzeljagd.henahax.net`) || Host(`schnitzeljagd.henahax.de`) || Host(`schatz.henahax.net`) || Host(`schatz.henahax.de`)"
      - "traefik.http.services.treasure-hunt.loadbalancer.server.port=3000"

  henahax-amoeben-indikator:
    container_name: henahax-amoeben-indikator
    image: henahax/amoeben-indikator:latest
    restart: unless-stopped

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      - PORT=3000
      - DATABASE_URL=/app/data/amoeben-indikator.db

    volumes:
      - amoeben-indikator-data:/app/data

    networks:
      - traefik

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.amoebe.rule=Host(`xn--ambe-6qa.henahax.net`) || Host(`xn--ambe-6qa.henahax.de`) || Host(`amoebe.henahax.net`) || Host(`amoebe.henahax.de`) || Host(`rainer.henahax.net`) || Host(`rainer.henahax.de`)"
      - "traefik.http.routers.amoebe.entrypoints=websecure"
      - "traefik.http.routers.amoebe.tls=true"
      - "traefik.http.routers.amoebe.tls.certresolver=letsencrypt"
      - "traefik.http.services.amoebe.loadbalancer.server.port=3000"

volumes:
  amoeben-indikator-data:
    driver: local
    driver_opts:
      type: none
      device: /container-volumes/data/amoeben-indikator
      o: bind

networks:
  traefik:
    external: true
