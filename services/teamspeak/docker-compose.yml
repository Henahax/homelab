services:
  teamspeak:
    container_name: teamspeak
    image: teamspeaksystems/teamspeak6-server:latest
    restart: unless-stopped
    environment:
      - TZ=Europe/Berlin
      - TSSERVER_LICENSE_ACCEPTED=accept
      - TSSERVER_QUERY_HTTP_ENABLED=true
    ports:
      - "9987:9987/udp" # Voice Port
      - "30033:30033/tcp" # File Transfer
      - "10011:10011/tcp" # Server Query
      - "8087:10080/tcp" # Web Query - TODO: Change
      # - "8087:10443/tcp" # Web Query - TODO: Change
    volumes:
      - teamspeak-data:/var/tsserver/
    networks:
      - teamspeak

  panda:
    container_name: panda
    build: https://github.com/KaanBahaSever/panda.git#main
    restart: unless-stopped
    depends_on:
      - teamspeak
    environment:
      - TZ=Europe/Berlin
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.musikbot.rule=Host(`musikbot.henahax.net`) || Host(`musikbot.henahax.de`) || Host(`musicbot.henahax.net`) || Host(`musicbot.henahax.de`)"
      - "traefik.http.routers.musikbot.entrypoints=websecure"
      - "traefik.http.routers.musikbot.tls=true"
      - "traefik.http.services.musikbot.loadbalancer.server.port=8080"
    volumes:
      - panda:/data
    networks:
      - traefik
      - teamspeak

volumes:
  teamspeak-data:
    driver: local
    driver_opts:
      type: none
      device: /container-volumes/data/teamspeak
      o: bind

  panda:
    driver: local
    driver_opts:
      type: none
      device: /container-volumes/data/panda
      o: bind

networks:
  traefik:
    external: true
  teamspeak:
    driver: bridge
